services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: atlasflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - "${ATLASFLOW_POSTGRES_DATA:-E:/codex/agent/data/postgres}:/var/lib/postgresql/data"
      - ./infra/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d atlasflow"]
      interval: 5s
      timeout: 5s
      retries: 10

