[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "atlasflow"
version = "0.8.0"
description = "Observable multi-agent research and decision platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "typing-extensions>=4.12,<5.0",
  "langchain-core>=1.4.7,<2.0",
  "langgraph>=1.2.11,<2.0",
  "langgraph-checkpoint>=4.3,<5.0",
  "langgraph-checkpoint-postgres>=3.1.3,<4.0",
  "psycopg[binary,pool]>=3.3,<4.0",
  "langsmith>=0.2,<1.0",
  "httpx>=0.27,<1.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.30,<1.0",
  "alembic>=1.14,<2.0",
  "pgvector>=0.3,<1.0",
  "pypdf>=5.0,<7.0",
  "python-multipart>=0.0.18,<1.0",
  "jieba>=0.42,<1.0",
  "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "ruff>=0.8,<1.0",
]
studio = [
  "langgraph-cli[inmem]>=0.4,<1.0",
]

[project.scripts]
atlasflow = "atlasflow.main:run"
atlasflow-knowledge = "atlasflow.knowledge.cli:main"
atlasflow-knowledge-worker = "atlasflow.knowledge.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/atlasflow"]

[tool.hatch.build.targets.wheel.force-include]
"evals/rag/dataset.json" = "atlasflow/evaluation/data/rag.json"
"evals/rag/reference-answers-v2.json" = "atlasflow/evaluation/data/rag-reference-answers-v2.json"
"evals/agent/dataset.json" = "atlasflow/evaluation/data/agent.json"
"evals/agent/dataset-v2.json" = "atlasflow/evaluation/data/agent-v2.json"

[tool.pytest.ini_options]
pythonpath = ["backend/src"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
